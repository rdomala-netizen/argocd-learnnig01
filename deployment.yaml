apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-learnning01
  namespace: argocd-learnning01
  labels:
    app: argocd-learnning01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-learnning01
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: argocd-learnning01
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: argocd-learnning01-html
