apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-dashboard
  namespace: argocd-learnning01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-dashboard-reader
rules:
  # Read deployments in the app namespace
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Read pods in the app namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read ArgoCD Application CRDs
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-dashboard-reader-binding
subjects:
  - kind: ServiceAccount
    name: gitops-dashboard
    namespace: argocd-learnning01
roleRef:
  kind: ClusterRole
  name: gitops-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
