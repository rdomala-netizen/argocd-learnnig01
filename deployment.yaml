apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo 
  namespace: argocd-learnning01
  labels:
    app: 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: 
    spec:
      serviceAccountName: gitops-dashboard
      containers:
        - name: dashboard
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAMESPACE
              value: "argocd-learnning01"
            - name: DEPLOYMENT_NAME
              value: ""
            - name: ARGOCD_APP_NAME
              value: ""
            - name: ARGOCD_NAMESPACE
              value: "argocd"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
