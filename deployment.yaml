apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: argocd-learnning01
  labels:
    app: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      serviceAccountName: gitops-dashboard
      containers:
        - name: dashboard
          image: gitops-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAMESPACE
              value: "argocd-learnning01"
            - name: DEPLOYMENT_NAME
              value: "learning01"
            - name: ARGOCD_APP_NAME
              value: "learning01"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
